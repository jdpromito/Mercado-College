<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Degree Programs - Mercado College</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Source Serif Pro', Georgia, serif !important;
    }

    body {
      background-color: #ffffff;
      color: #333333;
    }

    /* SOLID DARK NAVY BLUE HEADER BAR (MOBILE & DESKTOP COMPATIBLE) */
    .top-header {
      background-color: #11223f !important;
      color: #ffffff;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      width: 100%;
      gap: 15px;
    }

    .contact-info {
      font-size: 0.85rem;
      color: #e5e7eb !important;
      letter-spacing: 0.5px;
      font-weight: 500;
      text-align: left;
    }

    .contact-info span {
      color: #facc15;
    }

    .back-btn-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(255, 255, 255, 0.12);
      color: #ffffff !important;
      text-decoration: none !important;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .back-btn-header:hover {
      background-color: #FFB800 !important;
      color: #0A192F !important;
      border-color: #FFB800 !important;
    }

    /* MAIN CONTAINER (FLEXBOX PARA SA STICKY SIDEBAR) */
    .program-details-container {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 40px;
      display: flex;
      gap: 50px;
      align-items: flex-start; /* NAPAKA-IMPORTANTE: Kailangan para gumana ang sticky */
      position: relative;
    }

    /* LEFT CONTENT AREA */
    .left-text-area {
      flex: 1.1;
    }

    .program-title {
      color: #11223f;
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 35px;
      letter-spacing: -0.5px;
    }

    .program-description p {
      color: #4b5563;
      font-size: 0.93rem;
      line-height: 1.65;
      text-align: justify;
      margin-bottom: 22px;
    }

    .program-description h3 {
      color: #11223f;
      font-size: 1.1rem;
      font-weight: 800;
      margin: 25px 0 12px 0;
    }

    .program-description ul {
      margin-left: 20px;
      margin-bottom: 20px;
      color: #4b5563;
      font-size: 0.93rem;
      line-height: 1.6;
    }

    .program-description ul li {
      margin-bottom: 6px;
    }

    /* RIGHT IMAGE AREA WITH STICKY EFFECT */
    .right-image-area {
      flex: 0.9;
      position: -webkit-sticky; /* Para sa Safari */
      position: sticky;         /* HETONG GUMAGAWA NG STICKY EFFECT */
      top: 40px;                /* Distansya mula sa itaas ng screen habang nag-i-scroll */
      align-self: flex-start;
    }

    .image-frame {
      width: 100%;
      max-width: 450px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      background-color: #f3f4f6;
    }

    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* RESPONSIVE DESIGN PARA SA MOBILE DEVICES */
    @media (max-width: 768px) {
      .top-header {
        padding: 12px 18px;
        gap: 10px;
      }

      .contact-info {
        font-size: 0.75rem; /* Bawasan nang kaunti ang font size sa mobile para hindi mag-wrap nang masagwa */
        line-height: 1.3;
      }

      .back-btn-header {
        padding: 5px 10px;
        font-size: 0.75rem;
      }

      .program-details-container {
        flex-direction: column-reverse; /* Inilalagay ang image sa itaas kapag maliit ang screen */
        padding: 0 20px;
        margin: 20px auto;
        gap: 25px;
      }

      .program-title {
        font-size: 1.8rem;
        margin-bottom: 20px;
      }

      .right-image-area {
        width: 100%;
        position: static; /* Tinatanggal ang sticky sa mobile para hindi masikip */
        margin-bottom: 10px;
      }
      
      .image-frame {
        max-width: 100%;
        border-radius: 20px;
      }
      
    }
  </style>
</head>
<body>

  <!-- TOP HEADER BAR -->
  <header class="top-header">
    <div class="contact-info">
      (043) 778 6352 &nbsp;<span>|</span>&nbsp; marketing@mercadocollege.edu.ph
    </div>
    
    <a href="academics.html" class="back-btn-header">
      <span class="arrow">&larr;</span> Back 
    </a>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="program-details-container">
    <div class="left-text-area">
      <h1 class="program-title" id="display-title">Bachelor of Science in Nursing</h1>
      <div class="program-description" id="display-desc">
        <!-- Dynamically injected via JavaScript -->
      </div>
    </div>

    <div class="right-image-area">
      <div class="image-frame">
        <img id="display-img" src="assets/nursing.jpg" alt="Program Image">
      </div>
    </div>
  </main>

  <!-- JAVASCRIPT FOR DYNAMIC DATA LOADING -->
  <script>

          <p>The College of Nursing features a state-of-the-art Nursing Skills Laboratory, where basics and competencies are learned prior to clinical exposure. This includes a simulation mini hospital fully equipped with all the tools and preparations students need. Students are closely monitored by competent and qualified clinical instructors and faculty to enable them to acquire both basic and advanced nursing skills in accordance with the learning objectives based on CMO 15, s.2017 set forth by the Commission on Higher Education.</p>

          <p>The College of Midwifery employs a state-of-the-art Skills Laboratory, where basic and advanced competencies are learned prior to clinical exposure. This includes a simulation mini-hospital complete with all necessary equipment and preparations. Students are closely monitored by competent and qualified clinical instructors and faculty to ensure acquisition of essential midwifery skills and achievement of learning objectives based on CMO 3, s.2023 set forth by the Commission on Higher Education.</p>

      "#elem-ed": {

          <p>Bachelor of Science in Elementary Education (BEEd) is a four-year degree program designed to prepare students to become professional elementary school teachers. The program provides a strong foundation in general education, pedagogy, and child development to equip future educators with the knowledge and skills needed to teach young learners in primary education.</p>

      "#sec-ed": {

      "#psychology": {

        desc: `

          <h3>Skills Required to Succeed</h3>

      "#ba": {
        title: "Bachelor of Science in Business Administration",

    programsData["#tcp"] = programsData["#other"];

    function loadProgramContent() {
      const hash = window.location.hash || '#nursing';
      
      if (programsData[hash]) {
        document.getElementById('display-title').innerText = programsData[hash].title;
        document.getElementById('display-desc').innerHTML = programsData[hash].desc;
        document.getElementById('display-img').src = programsData[hash].img;
      } else {
        document.getElementById('display-title').innerText = programsData['#nursing'].title;
        document.getElementById('display-desc').innerHTML = programsData['#nursing'].desc;
        document.getElementById('display-img').src = programsData['#nursing'].img;
      }
    }

    window.addEventListener('load', loadProgramContent);
    window.addEventListener('hashchange', loadProgramContent);
  </script>

</body>
</html>
